<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escribot — Academic IELTS Writing Studio & Exam Simulator</title>
    <meta
      name="description"
      content="Break past the Band 6.5 plateau with guided outlining, L1-aware academic coaching, computer-delivered IELTS exam simulation, and DeepSeek 4-criterion band diagnostics."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Calm Study typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@100..900&display=swap"
    />
    <!-- The API's Content-Security-Policy allows this script by its SHA-256 hash
         (SecurityHeaders.ThemeScriptHash): change one byte inside it and update the hash. -->
    <script>
      try {
        const stored = localStorage.getItem("fe-theme");
        if (stored === "dark" || (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // Storage can be unavailable in restricted browsing contexts.
      }
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-canvas text-ink selection:bg-accent-soft selection:text-ink">
    <div id="root" class="contents"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
