name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    # Runs with no secrets and read-only contents, so it is safe for pull
    # requests from forks. Scans every commit reachable from the checked-out ref.
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --exit-code 1 .'

  client:
    # The Vite browser app (client/): lint, type check and production build.
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  dotnet:
    # The .NET server (server/). Uses no repository secrets: the one secret the app needs
    # is generated per run. The AppHost test starts the Cosmos DB and Azurite emulators as
    # containers on the runner.
    runs-on: self-hosted
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
      # For scripts/test-isolation.mjs, which the image test runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Aspire serves the Cosmos DB emulator over HTTPS with the ASP.NET Core development
      # certificate. A fresh runner has none, so create one that exists only for this job.
      - name: Create a development certificate
        run: |
          # .NET on Linux trusts the certificate through this OpenSSL directory.
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"
          # Exit code 4 means trusted by OpenSSL and .NET but not by browsers, which the
          # runner does not have.
          dotnet dev-certs https --trust || [ $? -eq 4 ]
      - run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"
      - name: Build Docker image
        # From the repository root: the image also builds and serves client/.
        working-directory: .
        run: docker build --file server/Dockerfile --tag fluentescritor-api:ci .
      - name: Image starts only with its secret
        run: |
          # Placeholder connections: creating the clients makes no network call.
          settings=(
            --env App__PublicUrl=https://app.example.test
            --env "ConnectionStrings__cosmos=AccountEndpoint=https://localhost:8081/;AccountKey=$(openssl rand -base64 64 | tr -d '\n');"
            --env ConnectionStrings__blobs=UseDevelopmentStorage=true
          )

          if docker run --rm "${settings[@]}" fluentescritor-api:ci > no-secret.log 2>&1; then
            echo "The container started without App__EncryptionSecret."
            exit 1
          fi
          if ! grep -q "App:EncryptionSecret is required" no-secret.log; then
            echo "The container failed for a different reason:"
            cat no-secret.log
            exit 1
          fi

          docker rm -f api >/dev/null 2>&1 || true
          docker run --detach --name api --publish 8080:8080 "${settings[@]}" \
            --env App__EncryptionSecret="$(openssl rand -hex 32)" \
            fluentescritor-api:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/alive; then
              # The browser app is in the image: a page address answers with index.html.
              curl -sf http://localhost:8080/login | grep -q '<div id="root"' && exit 0
              echo "The image does not serve the browser app."
              docker logs api
              exit 1
            fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: Cleanup Docker container
        if: always()
        run: docker rm -f api >/dev/null 2>&1 || true
      - name: Tenant isolation test against the image
        # Starts the AppHost's emulators with this image in place of the API project and runs
        # scripts/test-isolation.mjs against it (see ImageIsolationTests).
        env:
          ISOLATION_TEST_IMAGE: fluentescritor-api:ci
        run: dotnet test --no-build --configuration Release --filter "Category=Image" --logger "console;verbosity=normal"
