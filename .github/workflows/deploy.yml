name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: meta
        run: |
          repo_lower=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=${repo_lower}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo_lower}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:latest
            ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Refuse to deploy while the budget kill switch has stopped the app
        env:
          RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          status=$(az containerapp show -g "$RESOURCE_GROUP_NAME" -n api --query properties.runningStatus -o tsv 2>/dev/null || true)
          if [ "$status" = "Stopped" ]; then
            echo "::error::The Container App is stopped (the monthly budget kill switch may have fired). Start it with 'az containerapp start -g <resource group> -n api', then re-run this workflow."
            exit 1
          fi

      - name: Deploy infrastructure and roll out image
        env:
          RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP }}
          LOCATION: ${{ vars.AZURE_LOCATION }}
          API_CONTAINER_IMAGE: ${{ needs.build.outputs.image }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          ENABLE_CUSTOM_DOMAIN_CERT: ${{ vars.ENABLE_CUSTOM_DOMAIN_CERT || 'false' }}
          BEHIND_CLOUDFLARE: ${{ vars.BEHIND_CLOUDFLARE || 'false' }}
          ORIGIN_CERT_PFX: ${{ secrets.ORIGIN_CERT_PFX }}
          ORIGIN_CERT_PASSWORD: ${{ secrets.ORIGIN_CERT_PASSWORD }}
          EMAIL_DOMAIN: ${{ vars.EMAIL_DOMAIN }}
          PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
          ACS_DATA_LOCATION: ${{ vars.ACS_DATA_LOCATION || 'United States' }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          BUDGET_AMOUNT: ${{ secrets.BUDGET_AMOUNT }}
          ENCRYPTION_SECRET: ${{ secrets.APP_ENCRYPTION_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ vars.STRIPE_PRICE_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_YEARLY: ${{ vars.STRIPE_PRICE_PRO_YEARLY }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          ALLOWED_SIGNUP_EMAILS: ${{ vars.ALLOWED_SIGNUP_EMAILS }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          FREE_PLAN_DAILY_AI_CAP: ${{ vars.FREE_PLAN_DAILY_AI_CAP }}
          FREE_PLAN_EVALUATIONS_PER_MONTH: ${{ vars.FREE_PLAN_EVALUATIONS_PER_MONTH }}
          FREE_PLAN_ASSISTS_PER_MONTH: ${{ vars.FREE_PLAN_ASSISTS_PER_MONTH }}
          PRO_PLAN_EVALUATIONS_PER_MONTH: ${{ vars.PRO_PLAN_EVALUATIONS_PER_MONTH }}
          PRO_PLAN_ASSISTS_PER_MONTH: ${{ vars.PRO_PLAN_ASSISTS_PER_MONTH }}
          SITE_OPERATOR: ${{ vars.SITE_OPERATOR }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          SITE_JURISDICTION: ${{ vars.SITE_JURISDICTION }}
        run: |
          set -euo pipefail
          if ! [[ "$BUDGET_AMOUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Set the BUDGET_AMOUNT secret in the production environment to a whole number (the monthly budget)."
            exit 1
          fi
          # The app refuses to start with a bad allowance; catch it here, before deploying.
          for name in FREE_PLAN_EVALUATIONS_PER_MONTH FREE_PLAN_ASSISTS_PER_MONTH PRO_PLAN_EVALUATIONS_PER_MONTH PRO_PLAN_ASSISTS_PER_MONTH; do
            value="${!name}"
            if [ -n "$value" ] && { ! [[ "$value" =~ ^[0-9]{1,7}$ ]] || [ "$((10#$value))" -gt 1000000 ]; }; then
              echo "::error::$name must be a whole number from 0 to 1000000, or unset for the default."
              exit 1
            fi
          done
          if [ "$BEHIND_CLOUDFLARE" = "true" ] && [ -z "$CUSTOM_DOMAIN" ]; then
            echo "::error::BEHIND_CLOUDFLARE is true but CUSTOM_DOMAIN is not set. Cloudflare proxies the custom domain."
            exit 1
          fi
          if [ "$BEHIND_CLOUDFLARE" = "true" ] && [ -z "$ORIGIN_CERT_PFX" ]; then
            echo "::warning::BEHIND_CLOUDFLARE is true without ORIGIN_CERT_PFX. The free managed certificate cannot renew behind Cloudflare's proxy; add a Cloudflare Origin certificate (see README)."
          fi
          params_file="$RUNNER_TEMP/deploy-params.json"
          headers_file="$RUNNER_TEMP/health-headers.txt"
          body_file="$RUNNER_TEMP/health-body.txt"
          trap 'rm -f "$params_file" "$headers_file" "$body_file"' EXIT

          jq -n \
            --arg rg "$RESOURCE_GROUP_NAME" \
            --arg loc "$LOCATION" \
            --arg img "$API_CONTAINER_IMAGE" \
            --arg domain "$CUSTOM_DOMAIN" \
            --argjson cert "$ENABLE_CUSTOM_DOMAIN_CERT" \
            --argjson cloudflare "$BEHIND_CLOUDFLARE" \
            --arg originPfx "$ORIGIN_CERT_PFX" \
            --arg originPwd "$ORIGIN_CERT_PASSWORD" \
            --arg emailDomain "$EMAIL_DOMAIN" \
            --arg pub "$PUBLIC_URL" \
            --arg acsLoc "$ACS_DATA_LOCATION" \
            --arg budgetEmail "$BUDGET_ALERT_EMAIL" \
            --argjson budgetAmt "$BUDGET_AMOUNT" \
            --arg enc "$ENCRYPTION_SECRET" \
            --arg stripeKey "$STRIPE_SECRET_KEY" \
            --arg stripeWh "$STRIPE_WEBHOOK_SECRET" \
            --arg googleSec "$GOOGLE_CLIENT_SECRET" \
            --arg orKey "$OPENROUTER_API_KEY" \
            --arg dsKey "$DEEPSEEK_API_KEY" \
            --arg gemKey "$GEMINI_API_KEY" \
            --arg oaiKey "$OPENAI_API_KEY" \
            --arg antKey "$ANTHROPIC_API_KEY" \
            --arg googleId "$GOOGLE_CLIENT_ID" \
            --arg priceMo "$STRIPE_PRICE_PRO_MONTHLY" \
            --arg priceYr "$STRIPE_PRICE_PRO_YEARLY" \
            --arg owner "$OWNER_EMAIL" \
            --arg allowed "$ALLOWED_SIGNUP_EMAILS" \
            --arg admins "$ADMIN_EMAILS" \
            --arg emailFrom "$EMAIL_FROM" \
            --arg cap "$FREE_PLAN_DAILY_AI_CAP" \
            --arg freeEvals "$FREE_PLAN_EVALUATIONS_PER_MONTH" \
            --arg freeAssists "$FREE_PLAN_ASSISTS_PER_MONTH" \
            --arg proEvals "$PRO_PLAN_EVALUATIONS_PER_MONTH" \
            --arg proAssists "$PRO_PLAN_ASSISTS_PER_MONTH" \
            --arg op "$SITE_OPERATOR" \
            --arg sup "$SUPPORT_EMAIL" \
            --arg jur "$SITE_JURISDICTION" \
            '{
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                "resourceGroupName": { "value": $rg },
                "location": { "value": $loc },
                "apiContainerImage": { "value": $img },
                "customDomain": { "value": $domain },
                "enableCustomDomainCert": { "value": $cert },
                "behindCloudflare": { "value": $cloudflare },
                "origin_certificate_pfx": { "value": $originPfx },
                "origin_certificate_password": { "value": $originPwd },
                "emailDomain": { "value": $emailDomain },
                "publicUrl": { "value": $pub },
                "acsDataLocation": { "value": $acsLoc },
                "budgetAlertEmail": { "value": $budgetEmail },
                "budgetAmount": { "value": $budgetAmt },
                "encryption_secret": { "value": $enc },
                "stripe_secret_key": { "value": $stripeKey },
                "stripe_webhook_secret": { "value": $stripeWh },
                "google_client_secret": { "value": $googleSec },
                "openrouter_api_key": { "value": $orKey },
                "deepseek_api_key": { "value": $dsKey },
                "gemini_api_key": { "value": $gemKey },
                "openai_api_key": { "value": $oaiKey },
                "anthropic_api_key": { "value": $antKey },
                "googleClientId": { "value": $googleId },
                "stripePriceProMonthly": { "value": $priceMo },
                "stripePriceProYearly": { "value": $priceYr },
                "ownerEmail": { "value": $owner },
                "allowedSignupEmails": { "value": $allowed },
                "adminEmails": { "value": $admins },
                "emailFrom": { "value": $emailFrom },
                "freePlanDailyAiCap": { "value": $cap },
                "freePlanEvaluationsPerMonth": { "value": $freeEvals },
                "freePlanAssistsPerMonth": { "value": $freeAssists },
                "proPlanEvaluationsPerMonth": { "value": $proEvals },
                "proPlanAssistsPerMonth": { "value": $proAssists },
                "siteOperator": { "value": $op },
                "supportEmail": { "value": $sup },
                "siteJurisdiction": { "value": $jur }
              }
            }' > "$params_file"

          az deployment sub create \
            --name "escribot-${GITHUB_RUN_NUMBER}" \
            --location "$LOCATION" \
            --template-file infra/main.bicep \
            --parameters "@${params_file}" \
            --query "properties.outputs.{apiFqdn:apiFqdn.value}" \
            --output json > "$RUNNER_TEMP/outputs.json"

          fqdn=$(jq -r '.apiFqdn' "$RUNNER_TEMP/outputs.json")
          echo "Deployed Container App FQDN: https://${fqdn}"
          if [ "$BEHIND_CLOUDFLARE" = "true" ]; then
            # Cloudflare Bot Fight Mode challenges datacenter IPs (including GitHub Actions
            # runners), so verify revision readiness via Azure first (ACA already probes
            # /alive and /health internally before marking a revision Healthy).
            rev_ok=false
            rev_json=""
            for _ in $(seq 1 10); do
              latest=$(az containerapp show -g "$RESOURCE_GROUP_NAME" -n api \
                --query "properties.latestRevisionName" -o tsv)
              ready=$(az containerapp show -g "$RESOURCE_GROUP_NAME" -n api \
                --query "properties.latestReadyRevisionName" -o tsv)
              if [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
                rev_json=$(az containerapp revision show -g "$RESOURCE_GROUP_NAME" -n api --revision "$latest" \
                  --query "{name:name,active:properties.active,healthState:properties.healthState,provisioningState:properties.provisioningState,trafficWeight:properties.trafficWeight,image:properties.template.containers[0].image}" \
                  -o json)
                if jq -e --arg img "$API_CONTAINER_IMAGE" \
                  '.active == true and .provisioningState == "Provisioned" and .healthState == "Healthy" and .trafficWeight == 100 and .image == $img' \
                  <<< "$rev_json" >/dev/null; then
                  rev_ok=true
                  break
                fi
              fi
              sleep 3
            done
            if [ "$rev_ok" != "true" ]; then
              echo "::error::Container App revision did not become ready and healthy for ${API_CONTAINER_IMAGE}: ${rev_json}"
              exit 1
            fi
            echo "Revision verified via Azure: $(jq -c . <<< "$rev_json")"

            # Smoke-check the custom domain through Cloudflare. Accept HTTP 200 or a
            # Cloudflare Bot Fight Mode challenge (HTTP 403 + cf-mitigated: challenge),
            # but still fail on 5xx origin/TLS errors or unexpected responses.
            cf_ok=false
            http_code=""
            for _ in $(seq 1 5); do
              http_code=$(curl -sS --max-time 30 -D "$headers_file" -o "$body_file" -w '%{http_code}' "https://${CUSTOM_DOMAIN}/health" || true)
              if [ "$http_code" = "200" ]; then
                cat "$body_file"
                echo ""
                cf_ok=true
                break
              fi
              if [ "$http_code" = "403" ] && grep -qi '^cf-mitigated:[[:space:]]*challenge' "$headers_file"; then
                echo "Cloudflare challenged the runner (HTTP 403, cf-mitigated: challenge); edge routing is active and revision health was verified via Azure."
                cf_ok=true
                break
              fi
              sleep 3
            done
            if [ "$cf_ok" != "true" ]; then
              echo "::error::https://${CUSTOM_DOMAIN}/health returned unexpected HTTP ${http_code}."
              cat "$headers_file" || true
              exit 1
            fi

            # The ingress only admits Cloudflare, so check that the direct address is refused.
            direct=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://${fqdn}/health" || true)
            if [ "$direct" = "200" ]; then
              echo "::error::https://${fqdn} answered directly; the Cloudflare-only ingress restriction is not in effect."
              exit 1
            fi
            echo "Direct address refused (HTTP ${direct})."
          else
            curl -sfS --retry 10 --retry-delay 3 --retry-all-errors "https://${fqdn}/health"
            echo ""
          fi
          echo "Health check passed."

  web:
    # Cloudflare serves the browser app from its edge (client/wrangler.jsonc), so a page loads
    # at once while the API is starting from zero. Static asset requests are free and
    # unlimited on the Workers free plan. Skipped until the Cloudflare secrets are set; the
    # API keeps serving the app either way.
    needs: deploy
    # BEHIND_CLOUDFLARE and CUSTOM_DOMAIN are production environment variables, which a
    # job-level `if` can't read (the environment applies only once the job starts), so the
    # first step checks them.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      BEHIND_CLOUDFLARE: ${{ vars.BEHIND_CLOUDFLARE }}
      WRANGLER_VERSION: 4.160.0
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Skip unless behind Cloudflare with its credentials
        id: creds
        # Runs before checkout, so there is no client/ directory yet.
        working-directory: .
        run: |
          if [ "$BEHIND_CLOUDFLARE" != "true" ] || [ -z "$CUSTOM_DOMAIN" ]; then
            echo "::notice::The app is not behind Cloudflare (BEHIND_CLOUDFLARE, CUSTOM_DOMAIN); the API keeps serving the browser app."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; the API keeps serving the browser app."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the browser app
        if: steps.creds.outputs.ready == 'true'
        run: |
          npm ci
          npm run build
          cp cloudflare/_headers dist/_headers

      - name: Keep the API's addresses off the Worker
        # Routes with no Worker: Cloudflare passes these straight to the API on Azure, as
        # before, so the Worker never sees API traffic (sign-in, Stripe webhooks, rate limits
        # on CF-Connecting-IP) or the health checks. A more specific route wins over the
        # Worker's "<domain>/*". Created before the Worker's route, so the API is never
        # answered by the Worker.
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          # The zone is the longest suffix of the domain that the token can see.
          zone_id=""
          name="$CUSTOM_DOMAIN"
          while [ -z "$zone_id" ] && [[ "$name" == *.* ]]; do
            zone_id=$(curl -sfS "${auth[@]}" "${api}/zones?name=${name}" | jq -r '.result[0].id // empty')
            [ -n "$zone_id" ] || name="${name#*.}"
          done
          if [ -z "$zone_id" ]; then
            echo "::error::No Cloudflare zone for ${CUSTOM_DOMAIN} is visible to CLOUDFLARE_API_TOKEN (it needs Zone: Read)."
            exit 1
          fi

          routes=$(curl -sfS "${auth[@]}" "${api}/zones/${zone_id}/workers/routes" | jq '.result')
          for pattern in "${CUSTOM_DOMAIN}/api/*" "${CUSTOM_DOMAIN}/alive" "${CUSTOM_DOMAIN}/health"; do
            route_id=$(jq -r --arg p "$pattern" '.[] | select(.pattern == $p) | .id' <<<"$routes")
            body=$(jq -n --arg p "$pattern" '{pattern: $p}')
            if [ -z "$route_id" ]; then
              curl -sfS -o /dev/null "${auth[@]}" -X POST --data "$body" "${api}/zones/${zone_id}/workers/routes"
              echo "Added ${pattern} with no Worker."
            else
              # Replacing the route without a script detaches any Worker from it.
              curl -sfS -o /dev/null "${auth[@]}" -X PUT --data "$body" "${api}/zones/${zone_id}/workers/routes/${route_id}"
              echo "${pattern} has no Worker."
            fi
          done

      - name: Deploy the browser app to Cloudflare
        if: steps.creds.outputs.ready == 'true'
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --routes "${CUSTOM_DOMAIN}/*"

